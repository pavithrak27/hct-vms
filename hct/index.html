<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hct</title>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML += '<div style="color:red; padding: 20px; font-family: monospace; z-index: 9999; position: absolute; top: 0; left: 0; background: white; width: 100%; height: 100%; overflow: auto;"><h3>Runtime Error</h3><pre>' + event.error?.stack + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="color:red; padding: 20px; font-family: monospace; z-index: 9999; position: absolute; top: 0; left: 0; background: white; width: 100%; height: 100%; overflow: auto;"><h3>Unhandled Promise Rejection</h3><pre>' + (event.reason && event.reason.stack ? event.reason.stack : event.reason) + '</pre></div>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
